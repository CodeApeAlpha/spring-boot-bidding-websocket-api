version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bidding-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bidding_db
      MYSQL_USER: bidding_user
      MYSQL_PASSWORD: bidding_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
