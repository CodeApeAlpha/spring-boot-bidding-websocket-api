<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidding WebSocket</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <header class="header">
      <div class="brand">
        <div class="brand-logo"></div>
        <div class="brand-title">Live Bidding</div>
      </div>
      <div id="status" class="status disconnected">Disconnected</div>
    </header>

    <main class="container">
      <section>
        <div class="card">
          <div class="section-title">
            <h2>Place a Bid</h2>
          </div>
          <div class="row" style="margin-bottom:8px;">
            <select id="itemSelect"></select>
          </div>
          <div class="row">
            <input id="bidderName" class="input" placeholder="Your name" />
            <input id="bidAmount" class="input" type="number" placeholder="Bid amount" step="0.01" />
            <button onclick="placeBid()">Place Bid</button>
          </div>
        </div>

        <div class="card">
          <div class="section-title"><h2>Live Bids</h2></div>
          <div id="bids" class="bids-list"></div>
        </div>
      </section>

      <section>
        <div class="card">
          <div class="section-title"><h2>Active Auctions</h2></div>
          <div id="auctions" class="auction-list"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
