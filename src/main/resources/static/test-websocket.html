<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test - Real-time Bidding</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .message { background-color: #f8f9fa; padding: 10px; margin: 5px 0; border-left: 4px solid #007bff; }
        .bid-message { background-color: #e7f3ff; border-left-color: #28a745; }
        .auction-message { background-color: #fff3cd; border-left-color: #ffc107; }
        button { padding: 10px 15px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>WebSocket Real-time Test</h1>
    
    <div id="status" class="status disconnected">Disconnected</div>
    
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="clearMessages()">Clear Messages</button>
    </div>
    
    <div>
        <h3>Test Bid Placement</h3>
        <select id="itemSelect">
            <option value="">Select an item...</option>
        </select>
        <input type="text" id="bidderName" placeholder="Bidder Name" />
        <input type="number" id="bidAmount" placeholder="Bid Amount" step="0.01" />
        <button onclick="placeBid()">Place Bid</button>
    </div>
    
    <div>
        <h3>WebSocket Messages</h3>
        <div id="messages"></div>
    </div>

    <script>
        let stompClient = null;
        let messageCount = 0;

        function setStatus(connected) {
            const el = document.getElementById('status');
            el.textContent = connected ? 'Connected' : 'Disconnected';
            el.className = 'status ' + (connected ? 'connected' : 'disconnected');
        }

        function addMessage(type, content) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + type + '-message';
            messageDiv.innerHTML = `
                <strong>[${new Date().toLocaleTimeString()}] ${type}:</strong> 
                ${typeof content === 'object' ? JSON.stringify(content, null, 2) : content}
            `;
            messagesDiv.insertBefore(messageDiv, messagesDiv.firstChild);
            messageCount++;
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
        }

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function (frame) {
                setStatus(true);
                addMessage('CONNECTION', 'Connected: ' + frame);

                // Subscribe to general auction updates
                stompClient.subscribe('/topic/auctions', function (message) {
                    const payload = JSON.parse(message.body);
                    addMessage('AUCTION', payload);
                });

                // Subscribe to item-specific bid updates
                stompClient.subscribe('/topic/bids/+', function (message) {
                    const payload = JSON.parse(message.body);
                    addMessage('BID', payload);
                });

                // Load available items
                loadItems();
            }, function(error) {
                addMessage('ERROR', 'STOMP error: ' + error);
                setStatus(false);
            });
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect();
                addMessage('CONNECTION', 'Disconnected');
            }
            setStatus(false);
        }

        function loadItems() {
            fetch('/api/items/active')
                .then(r => r.json())
                .then(items => {
                    const select = document.getElementById('itemSelect');
                    select.innerHTML = '<option value="">Select an item...</option>';
                    items.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = item.name + ' - $' + item.currentHighestBid;
                        select.appendChild(option);
                    });
                    addMessage('INFO', 'Loaded ' + items.length + ' active items');
                })
                .catch(e => addMessage('ERROR', 'Error loading items: ' + e));
        }

        function placeBid() {
            const itemId = document.getElementById('itemSelect').value;
            const bidderName = document.getElementById('bidderName').value;
            const amount = document.getElementById('bidAmount').value;
            
            if (!itemId || !bidderName || !amount) {
                addMessage('ERROR', 'Please fill in all fields');
                return;
            }

            const dto = { 
                itemId: parseInt(itemId), 
                bidderName, 
                amount: parseFloat(amount) 
            };
            
            addMessage('INFO', 'Placing bid: ' + JSON.stringify(dto));
            
            fetch('/api/bids', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(dto) 
            })
            .then(res => {
                if (res.ok) {
                    addMessage('SUCCESS', 'Bid placed successfully');
                    document.getElementById('bidAmount').value = '';
                } else {
                    res.text().then(text => addMessage('ERROR', 'Failed to place bid: ' + text));
                }
            })
            .catch(e => addMessage('ERROR', 'Error placing bid: ' + e));
        }

        // Auto-connect on page load
        window.onload = function() {
            addMessage('INFO', 'Page loaded. Click Connect to start testing WebSocket.');
        };
    </script>
</body>
</html>
